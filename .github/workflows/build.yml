# 在真实的 macOS / Windows 机器上打包安装包。
# 触发：
#   - 推送到 main（只改文档时跳过）：打包后更新公开的「latest」预发布版，安装包可直接下载
#   - 推送 v* 标签（如 v1.0.1）：打包后附加到对应的 Release 草稿
#   - GitHub 网页 Actions → Build installers → Run workflow：手动打包
# 每次运行的安装包也会保存在运行页面底部的 Artifacts 里。
name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'extension/**'

permissions:
  contents: write

# 同一分支连续推送时，只打最新的一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
          - os: windows-latest
            script: dist:win
            files: |
              release/*.exe
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall 会修复 Electron 二进制，并在 macOS 上编译输入监听辅助程序
      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          # 不自动发布，只生成本地文件
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # macOS 自签名证书（scripts/mac-sign.js）：固定签名，更新后不用重新授权权限。未配置时退回 ad-hoc
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: english-tools-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}

  # main 上的最新构建：替换公开的 latest 预发布版（Artifacts 要登录才能下载，Release 不用）
  publish-latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "最新构建（main @ ${GITHUB_SHA::7}）" \
            --notes "main 分支每次推送自动打包。macOS 下载后需运行一次：xattr -dr com.apple.quarantine \"/Applications/English Tools.app\""
